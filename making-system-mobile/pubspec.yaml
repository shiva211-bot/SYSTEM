name: making_system_mobile
description: Production-oriented Flutter mobile client for the Making System chat platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  socket_io_client: ^3.1.6
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  pointycastle: ^4.0.0
  sqflite_sqlcipher: ^3.4.1
  path: ^1.9.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
